name: Build

on:
  push:
  pull_request:

jobs:
  build-main-package:
    name: Build TouchVitals package (Swift 6 mode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift build
        run: swift build -v

  build-touchbar-spike:
    name: Build Phase 0 spike (Swift 5 mode, private DFRFoundation APIs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Spikes/TouchBarSpike
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift build
        run: swift build -v
